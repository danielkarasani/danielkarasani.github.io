backend:
  name: github
  repo: danielkarasani/danielkarasani.github.io
  branch: main
media_folder: public/images
public_folder: /images
i18n:
  structure: multiple_folders
  locales:
    - en
    - de
    - it
  default_locale: en
collections:
  - name: theme
    label: Theme & Design Settings
    i18n: false
    files:
      - name: styles
        label: Website Theme Styles
        file: src/data/theme.json
        format: json
        fields:
          - label: Colors
            name: colors
            widget: object
            collapsed: false
            fields:
              - label: Main Background
                name: bg_main
                widget: color
                default: '#fcfaf8'
                hint: Background for standard sections
              - label: Hero Background
                name: bg_hero
                widget: color
                default: '#ece6dd'
                hint: Background for the top section
              - label: Text Color (Dark)
                name: text_dark
                widget: color
                default: '#2c2420'
              - label: Text Color (Muted)
                name: text_muted
                widget: color
                default: '#5a4f48'
              - label: Accent Color (Primary)
                name: accent
                widget: color
                default: '#c89b72'
                hint: Used for buttons, links, and gradients
              - label: Accent Color (Hover)
                name: accent_hover
                widget: color
                default: '#b3855c'
          - label: Typography (Text Sizes)
            name: typography
            widget: object
            collapsed: false
            fields:
              - label: Base Font Size (e.g. 16px, 1rem)
                name: font_base
                widget: string
                default: 16px
              - label: H1 Size (Hero Title)
                name: h1_size
                widget: string
                default: 4.5rem
              - label: H2 Size (Section Titles)
                name: h2_size
                widget: string
                default: 3.5rem
              - label: H3 Size
                name: h3_size
                widget: string
                default: 2rem
          - label: Layout & Effects
            name: layout
            widget: object
            collapsed: false
            fields:
              - label: Border Radius (e.g. 12px, 0.5rem)
                name: border_radius
                widget: string
                default: 12px
                hint: Curve of cards and buttons
              - label: Animation Speed (e.g. 0.4s)
                name: transition_speed
                widget: string
                default: 0.4s
                hint: Speed of hover effects and page transitions
          - label: Advanced Mode Toggle
            name: advanced
            widget: boolean
            default: true
            hint: Enable advanced experimental styles.
  - name: pages
    label: Website Pages
    i18n: true
    files:
      - name: global
        label: Global Settings
        file: src/data/{{locale}}/global.json
        format: json
        i18n: true
        fields:
          - label: Logo Text
            name: logo_text
            widget: string
            i18n: true
          - label: Footer Text
            name: footer_text
            widget: string
            i18n: true
          - label: Navigation Links
            name: nav_links
            widget: list
            collapsed: true
            i18n: true
            fields:
              - label: Name
                name: name
                widget: string
              - label: URL
                name: url
                widget: string
          - label: Social Links
            name: social_links
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: LinkedIn URL
                name: linkedin
                widget: string
              - label: GitHub URL
                name: github
                widget: string
          - label: Footer Content
            name: footer
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: Availability Text
                name: availability
                widget: string
              - label: Address & Contact
                name: address
                widget: string
              - label: Copyright
                name: copyright
                widget: text
                required: false
      - name: home
        label: Home Page
        file: src/data/{{locale}}/home.json
        format: json
        i18n: true
        fields:
          - label: Page Sections
            name: blocks
            widget: list
            types:
              - label: Hero Section
                name: hero
                widget: object
                fields:
                  - label: Tagline
                    name: tagline
                    widget: string
                  - label: Title
                    name: title
                    widget: string
                  - label: Typing Text (Gradient)
                    name: typing_text
                    widget: string
                  - label: Quote
                    name: quote
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                  - label: Experience Button Text
                    name: btn_experience
                    widget: string
                  - label: Contact Button Text
                    name: btn_contact
                    widget: string
                  - label: CV Download Button Text
                    name: btn_cv_local
                    widget: string
                  - label: CV Cloud Button Text
                    name: btn_cv_cloud
                    widget: string
                  - label: CV Last Updated Text
                    name: cv_last_updated
                    widget: string
                  - label: Hero Image
                    name: image
                    widget: image
              - label: About Preview Section
                name: about_preview
                widget: object
                fields:
                  - label: Title
                    name: title
                    widget: string
                  - label: Paragraphs
                    name: paragraphs
                    widget: list
                    field:
                      label: Paragraph
                      widget: text
                  - label: Quote
                    name: quote
                    widget: string
                  - label: Read More Button Text
                    name: btn_read_more
                    widget: string
              - label: Projects Section
                name: projects
                widget: object
                fields:
                  - label: Title
                    name: title
                    widget: string
                  - label: Project Items
                    name: items
                    widget: list
                    collapsed: true
                    fields:
                      - label: Image
                        name: image
                        widget: image
                        required: false
                      - label: Images (Slideshow)
                        name: images
                        widget: list
                        field:
                          label: Image
                          widget: image
                        required: false
                      - label: Image CSS Class (Optional)
                        name: image_class
                        widget: string
                        required: false
                      - label: Tagline
                        name: tagline
                        widget: string
                      - label: Title
                        name: title
                        widget: string
                      - label: Description
                        name: description
                        widget: text
                      - label: Skills
                        name: skills
                        widget: string
                      - label: Button Text
                        name: btn_text
                        widget: string
                      - label: Button URL
                        name: btn_url
                        widget: string
              - label: Pre-Contact CTA
                name: pre_contact
                widget: object
                fields:
                  - label: Title
                    name: title
                    widget: string
                  - label: Description
                    name: description
                    widget: text
              - label: Contact Form
                name: contact
                widget: object
                fields:
                  - label: Title
                    name: title
                    widget: string
                  - label: Name Placeholder
                    name: name_placeholder
                    widget: string
                  - label: Email Placeholder
                    name: email_placeholder
                    widget: string
                  - label: Message Placeholder
                    name: message_placeholder
                    widget: string
                  - label: Submit Button Text
                    name: btn_submit
                    widget: string
              - label: Experience Timeline (Pulled from About Page)
                name: experience_preview
                widget: object
                fields:
                  - label: Note
                    name: note
                    widget: string
                    default: This automatically displays the timeline from your About page.
                    required: false
              - label: Education (Pulled from About Page)
                name: education_preview
                widget: object
                fields:
                  - label: Note
                    name: note
                    widget: string
                    default: This automatically displays the Education section from your About page.
                    required: false
              - label: Skills (Pulled from About Page)
                name: skills_preview
                widget: object
                fields:
                  - label: Note
                    name: note
                    widget: string
                    default: This automatically displays the Skills section from your About page.
                    required: false
              - label: Certifications (Pulled from About Page)
                name: certifications_preview
                widget: object
                fields:
                  - label: Note
                    name: note
                    widget: string
                    default: This automatically displays the Certifications section from your About page.
                    required: false
      - name: about
        label: About Page
        file: src/data/{{locale}}/about.json
        format: json
        i18n: true
        fields:
          - label: Page Sections
            name: blocks
            widget: list
            types:
              - label: Section Headings
                name: headings
                widget: object
                fields:
                  - label: Professional Experience Heading
                    name: experience
                    widget: string
                  - label: Education Heading
                    name: education
                    widget: string
                  - label: Certifications Heading
                    name: certifications
                    widget: string
                  - label: Skills Heading
                    name: skills
                    widget: string
                  - label: Core Expertise Heading
                    name: expertise
                    widget: string
              - label: About Page Image
                name: about_image
                widget: object
                fields:
                  - label: Image
                    name: image
                    widget: image
              - label: My Story
                name: story
                widget: object
                fields:
                  - label: Main Title
                    name: title
                    widget: string
                  - label: Contact Button Text
                    name: btn_contact
                    widget: string
                  - label: Timeline Button Text
                    name: btn_timeline
                    widget: string
                  - label: Story Blocks
                    name: blocks
                    widget: list
                    collapsed: true
                    fields:
                      - label: Block Title
                        name: title
                        widget: string
                      - label: Content
                        name: content
                        widget: text
                      - label: Border Color Variable (e.g. var(--text-dark))
                        name: border_color
                        widget: string
                        required: false
              - label: Career Timeline
                name: timeline
                widget: object
                fields:
                  - label: Items
                    name: items
                    widget: list
                    fields:
                      - label: Date Range
                        name: date_range
                        widget: string
                      - label: Company/Entity Name
                        name: company
                        widget: string
                      - label: Company URL
                        name: url
                        widget: string
                        required: false
                      - label: Company Logo
                        name: logo
                        widget: image
                        required: false
                      - label: Logo CSS Class
                        name: logo_class
                        widget: string
                        required: false
                      - label: Logo Width
                        name: width
                        widget: number
                        value_type: int
                        required: false
                      - label: Logo Height
                        name: height
                        widget: number
                        value_type: int
                        required: false
                      - label: Roles/Positions
                        name: roles
                        widget: list
                        collapsed: true
                        fields:
                          - label: Job Title
                            name: title
                            widget: string
                          - label: Date & Location
                            name: date
                            widget: string
                          - label: Role URL (Optional)
                            name: url
                            widget: string
                            required: false
                          - label: Role Logo (Optional)
                            name: logo
                            widget: image
                            required: false
                          - label: Bullet Points
                            name: bullets
                            widget: list
              - label: Education
                name: education
                widget: object
                fields:
                  - label: Items
                    name: items
                    widget: list
                    fields:
                      - label: Date Range
                        name: date_range
                        widget: string
                      - label: School Name
                        name: school
                        widget: string
                      - label: School URL
                        name: url
                        widget: string
                        required: false
                      - label: Logos
                        name: logos
                        widget: list
                        collapsed: true
                        fields:
                          - label: Image
                            name: src
                            widget: image
                          - label: Alt Text
                            name: alt
                            widget: string
                      - label: Description Paragraphs
                        name: paragraphs
                        widget: list
                        field:
                          label: Text
                          widget: text
              - label: Certifications
                name: certifications
                widget: object
                fields:
                  - label: Items
                    name: items
                    widget: list
              - label: Skills Categories
                name: skills
                widget: object
                fields:
                  - label: Items
                    name: items
                    widget: list
                    fields:
                      - label: Category Name
                        name: category
                        widget: string
                      - label: Skill Tags
                        name: tags
                        widget: list
              - label: Keywords / Expertise Cloud
                name: keywords
                widget: object
      - name: air_analyzer
        label: Air Analyzer Page
        file: src/data/{{locale}}/air-analyzer.json
        format: json
        i18n: true
        fields:
          - label: Hero Section
            name: hero
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: Tagline
                name: tagline
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Quote
                name: quote
                widget: string
          - label: Content Body
            name: body
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: Intro Paragraph
                name: intro
                widget: text
              - label: Architecture Heading
                name: h_arch
                widget: string
              - label: Architecture Paragraph
                name: p_arch
                widget: text
              - label: Architecture Bullet 1
                name: li_arch_1
                widget: string
              - label: Architecture Bullet 2
                name: li_arch_2
                widget: string
              - label: Gallery Heading
                name: h_gallery
                widget: string
              - label: Gallery Alt 1
                name: alt_gallery_1
                widget: string
              - label: Gallery Alt 2
                name: alt_gallery_2
                widget: string
              - label: Gallery Alt 3
                name: alt_gallery_3
                widget: string
              - label: Gallery Alt 4
                name: alt_gallery_4
                widget: string
              - label: Gallery Alt 5
                name: alt_gallery_5
                widget: string
              - label: Sensors Heading
                name: h_sensors
                widget: string
              - label: Sensor Bullet 1
                name: li_sensors_1
                widget: string
              - label: Sensor Bullet 2
                name: li_sensors_2
                widget: string
              - label: Sensor Bullet 3
                name: li_sensors_3
                widget: string
              - label: Sensor Bullet 4
                name: li_sensors_4
                widget: string
              - label: Software Heading
                name: h_software
                widget: string
              - label: Software Paragraph
                name: p_software
                widget: text
              - label: Software Bullet 1
                name: li_software_1
                widget: string
              - label: Software Bullet 2
                name: li_software_2
                widget: string
              - label: Software Bullet 3
                name: li_software_3
                widget: string
              - label: Project Heading
                name: h_project
                widget: string
              - label: Project Paragraph
                name: p_project
                widget: text
              - label: Project Bullet 1
                name: li_project_1
                widget: string
              - label: Project Bullet 2
                name: li_project_2
                widget: string
              - label: Project Bullet 3
                name: li_project_3
                widget: string
              - label: CTA Text
                name: cta_text
                widget: string
              - label: CTA Subtext
                name: cta_subtext
                widget: string
              - label: CTA URL
                name: cta_url
                widget: string
      - name: blog_ui
        label: Blog Page UI Strings
        file: src/data/{{locale}}/blog.json
        format: json
        i18n: true
        fields:
          - label: Hero Section
            name: hero
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: Tagline
                name: tagline
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Quote
                name: quote
                widget: string
          - label: Controls Section
            name: controls
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: 'Filter: All'
                name: filter_all
                widget: string
              - label: 'Filter: Engineering'
                name: filter_engineering
                widget: string
              - label: 'Filter: General'
                name: filter_general
                widget: string
              - label: 'Filter: Off-Topic'
                name: filter_offtopic
                widget: string
              - label: Search Placeholder
                name: search_placeholder
                widget: string
              - label: Sort Label
                name: sort_label
                widget: string
              - label: 'Sort: Default'
                name: sort_default
                widget: string
              - label: 'Sort: Newest'
                name: sort_newest
                widget: string
              - label: 'Sort: Oldest'
                name: sort_oldest
                widget: string
              - label: 'Sort: A-Z'
                name: sort_az
                widget: string
              - label: 'Sort: Z-A'
                name: sort_za
                widget: string
          - label: Card UI
            name: card
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: Read Article Text
                name: read_article
                widget: string
              - label: Uncategorized Text
                name: uncategorized
                widget: string
          - label: Modal UI
            name: modal
            widget: object
            collapsed: true
            i18n: true
            fields:
              - label: Loading Text
                name: loading
                widget: string
  - name: blog
    label: Blog Posts
    folder: public/posts
    create: true
    slug: '{{slug}}'
    fields:
      - label: Publish in English
        name: publish_en
        widget: boolean
        default: true
      - label: Publish in German
        name: publish_de
        widget: boolean
        default: true
      - label: Publish in Italian
        name: publish_it
        widget: boolean
        default: true
      - label: Category
        name: category
        widget: select
        options:
          - Engineering & Research
          - General Topics
          - Off-Topic
        default: Engineering & Research
      - label: Tags
        name: tags
        widget: list
        required: false
      - label: Title (English)
        name: title
        widget: string
      - label: Title (German)
        name: title_de
        widget: string
        required: false
      - label: Title (Italian)
        name: title_it
        widget: string
        required: false
      - label: Publish Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Description (English)
        name: description
        widget: string
      - label: Description (German)
        name: description_de
        widget: string
        required: false
      - label: Description (Italian)
        name: description_it
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown
