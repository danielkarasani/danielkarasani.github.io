    <style id="critical-path-css">
:root {
    --bg-main: #fcfaf8;       
    --bg-hero: #ece6dd;       
    --text-dark: #2c2420;     
    --text-muted: #5a4f48;    
    --accent: #c89b72;        
    --accent-hover: #b3855c;  
    --white: #ffffff;
    --nav-bg: rgba(252, 250, 248, 0.7); 
    --gradient-text: linear-gradient(135deg, var(--text-dark), var(--accent));
}
body.dark-theme, html.dark-theme body {
    --bg-main: #1a1512;       
    --bg-hero: #241e1a;       
    --text-dark: #fcfaf8;     
    --text-muted: #b5a89f;    
    --accent: #d8b08d;        
    --white: #241e1a;         
    --nav-bg: rgba(26, 21, 18, 0.85); 
}
body {
    background-color: var(--bg-main);
    color: var(--text-dark);
}
#preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: var(--text-dark);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease, visibility 0.8s;
}
.loader-text {
    color: var(--white);
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.2rem;
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-align: center;
    padding: 0 20px;
    min-height: 1.5em;
    line-height: 1.5;
}
.loader-bar {
    width: 250px;
    height: 2px;
    background: rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
}
.loader-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--accent);
    animation: loadBar 2s ease forwards;
}
@keyframes loadBar {
    0% { width: 0%; }
    100% { width: 100%; }
}
.loaded #preloader {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
</style>
    <link rel="stylesheet" href="variables.css">

    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.className += ' dark-theme';

            document.documentElement.classList.add('preloader-skipped');
            document.write('<style>#preloader { display: none !important; }</style>');
        }
    </script>
    <noscript>
        <style>
            #preloader { display: none !important; }
            .reveal { opacity: 1 !important; transform: translateY(0) !important; }
            .cursor-dot, .cursor-outline { display: none !important; }
            * { cursor: auto !important; }
            a, button, input, textarea { cursor: pointer !important; }

            /* Mobile Navigation Fallback when JS is disabled */
            @media (max-width: 990px) {
                .nav-links {
                    position: static !important;
                    display: flex !important;
                    flex-direction: row !important;
                    flex-wrap: wrap !important;
                    justify-content: center !important;
                    gap: 15px !important;
                    transform: none !important;
                    opacity: 1 !important;
                    pointer-events: auto !important;
                    height: auto !important;
                    padding: 10px 0 !important;
                    background: transparent !important;
                    backdrop-filter: none !important;
                }
                .nav-links li {
                    width: auto !important;
                    opacity: 1 !important;
                    transform: none !important;
                }
                .nav-links a {
                    font-size: 1rem !important;
                    padding: 5px 10px !important;
                }
                .nav-container {

                }
                nav {

                }
                .hero {
                    padding-top: 40px !important;
                }
                #theme-toggle {
                    display: none !important;
                }
            }
        </style>
    </noscript>
