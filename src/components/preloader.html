<noscript>
    <style>
        /* 1. Kill the preloader immediately */
        #preloader { display: none !important; }

        /* 2. Force all hidden reveal elements to be visible */
        .reveal { opacity: 1 !important; transform: translateY(0) !important; }

        /* 3. Hide the stuck custom cursor elements */
        .cursor-dot, .cursor-outline { display: none !important; }

        /* 4. Ensure standard mouse cursors work normally */
        * { cursor: auto !important; }
        a, button, input, textarea { cursor: pointer !important; }
        
        /* 5. Stop animations to save CPU */
        .hero::before { animation: none !important; }

        /* 6. Mobile Navigation Fallback when JS is disabled */
        @media (max-width: 990px) {
            .nav-links {
                position: static !important;
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 15px !important;
                transform: none !important;
                opacity: 1 !important;
                pointer-events: auto !important;
                height: auto !important;
                padding: 10px 0 !important;
                background: transparent !important;
                backdrop-filter: none !important;
            }
            .nav-links li {
                width: auto !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .nav-links a {
                font-size: 1rem !important;
                padding: 5px 10px !important;
            }
            .nav-container {
                flex-direction: column !important;
                gap: 10px !important;
                padding: 10px 20px !important;
            }
            nav {
                position: static !important;
                padding: 10px 0 !important;
            }
            .hero {
                padding-top: 40px !important;
            }
            #theme-toggle {
                display: none !important;
            }
        }
    </style>
</noscript>

    <div class="loader-text">{{PRELOADER_TEXT}}</div>

</div>
